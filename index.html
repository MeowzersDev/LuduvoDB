<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luduvo Database</title>
  <style>
    body {
      background-color: #222222;
      margin: 0;
      padding: 20px; 
      height: 100vh;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      background-color: #d8d8d8; 
      width: 100%;
      max-width: 600px;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin: 10px 0 5px 0;
      font-size: 28px;
      color: #000;
    }

    h2 {
      margin: 0 0 30px 0;
      font-size: 18px;
      font-weight: normal;
      color: #222;
    }

    .directory-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .directory-link {
      font-size: 18px;
      color: #000;
      text-decoration: none;
      padding: 10px 20px;
      border: 1px solid #999;
      background-color: #eee;
      width: 200px;
      transition: background-color 0.2s;
    }

    .directory-link:hover {
      background-color: #ccc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to the Luduvo Database</h1>
    <h2>Pages Directory:</h2>
    
    <div class="directory-list">
      <a href="./users/" class="directory-link">/users</a>

    </div>
  </div>
</body>
</html>
