<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Site</title>
    <style>
        /* Basic styling to make it look nice */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            transition: background-color 0.3s ease;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 5px;
            background-color: white;
        }
        button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>This is my first website hosted on GitHub Pages.</p>
    
    <!-- The button and paragraph our JavaScript will interact with -->
    <button id="actionButton">Click Me</button>
    <h2 id="messageArea"></h2>

    <!-- This links your JavaScript file to the HTML -->
    <script src="app.js"></script>
</body>
</html>
